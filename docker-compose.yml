# 世界知识门户：数据底座 = MySQL + Directus（headless CMS）
# 说明：表结构由 Directus 建并管理；后端 FastAPI 只做只读映射与自定义端点。
services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=world_knowledge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 后台 + 数据层：Directus 自动建表、出 REST/GraphQL、管用户权限
  directus:
    image: directus/directus:latest
    ports:
      - "8055:8055"
    environment:
      - KEY=${DIRECTUS_KEY:-change-me-key}
      - SECRET=${DIRECTUS_SECRET:-change-me-secret}
      - DB_CLIENT=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=world_knowledge
      - DB_USER=root
      - DB_PASSWORD=password
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL:-admin@worldknowledge.org}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD:-password}
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      - mysql

  # 后端：FastAPI + SQLModel（薄层自定义端点）
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/world_knowledge
      - DIRECTUS_URL=http://directus:8055
      - MEILISEARCH_HOST=http://meilisearch:7700
    depends_on:
      - mysql
      - meilisearch

  # 搜索（后期接入）
  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      - MEILI_MASTER_KEY=change-me-master-key
    ports:
      - "7700:7700"

volumes:
  mysql_data:
  directus_uploads:
