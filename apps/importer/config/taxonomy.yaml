      - { qid: Q30612, expect_zh: 臨床試驗, tradition: empirical, limit: 4, min_sitelinks: 6, stage: research }
      - { qid: Q177719, expect_zh: 诊断, tradition: empirical, limit: 4, min_sitelinks: 6 }
      - { qid: Q189603, expect_zh: 公共卫生, tradition: empirical, limit: 5, min_sitelinks: 8 }
      - { qid: Q133981, expect_zh: 急救, tradition: empirical, limit: 4, min_sitelinks: 6 }
      - { qid: Q133805, expect_zh: 流行病学, tradition: empirical, limit: 5, min_sitelinks: 8 }
