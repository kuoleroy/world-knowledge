      # ---- 经验·乡土线（草药 / 助产 / 民族医学）----
      # 注意：herbalism（Q861699）已弃用——上游中文标签是「草药师」（herbalist），
      # 与「草药医学」概念不符，会让节点标题误导；经验线改用下面四个种子覆盖。
